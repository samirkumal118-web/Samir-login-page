<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0ea5e9, #f97316);
      color: white;
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      font-size: 40px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1> You have successfully logged in</h1>


  <button onclick="logout()">Logout</button>

  <script>
    function logout() {
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
